<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐰 うさうさ作問スタジオ / Usausa Quiz Studio</title>
<style>
  :root{
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  /* ===== 日本語テーマ：ジャパンブルー（水色ペール＋濃い青ベース） ===== */
  body.theme-ja{
    --brand:#15568a; --brand-d:#0e3c63; --accent:#5fa8d3; --accent-t:#0c2f50;
    --bg-1:#f3f8fc; --bg-2:#e3eef7; --card:#ffffff;
    --ink:#15293c; --ink-2:#5f7589; --line:#dde8f2; --line-2:#c4d6e6;
    --ok:#2f8b6c; --ok-bg:#e7f5ef; --ng:#d05a52; --ng-bg:#fbe9e7;
    --info:#15568a; --info-bg:#e3eef7;
    --pageglow-1:#e2eef8; --pageglow-2:#d4e6f4;
    --shadow:rgba(21,86,138,.20); --shadow-soft:rgba(21,86,138,.10);
    --display:var(--sans);
  }
  /* ===== 英語テーマ：イギリス国旗風ペール ===== */
  body.theme-en{
    --brand:#4a5f86; --brand-d:#36486b; --accent:#b56576; --accent-t:#5a2733;
    --bg-1:#f7f4ef; --bg-2:#eceef4; --card:#ffffff;
    --ink:#2c3242; --ink-2:#7c8295; --line:#e6e3da; --line-2:#cfd6e3;
    --ok:#4f8a78; --ok-bg:#e8f1ed; --ng:#b56576; --ng-bg:#f5e7ea;
    --info:#4a5f86; --info-bg:#e8ecf4;
    --pageglow-1:#e6ebf5; --pageglow-2:#f3e6e9;
    --shadow:rgba(54,72,107,.20); --shadow-soft:rgba(54,72,107,.10);
    --display:var(--serif);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);line-height:1.6;min-height:100vh;
    background:
      radial-gradient(1200px 420px at 90% -5%, var(--pageglow-1) 0%, transparent 60%),
      radial-gradient(900px 380px at -5% 110%, var(--pageglow-2) 0%, transparent 55%),
      var(--bg-1);
    transition:background .3s;}
  .app{max-width:1280px;margin:0 auto;padding:18px 18px 60px;}

  /* theme ribbon */
  .ribbon{height:6px;border-radius:6px;margin-bottom:14px;}
  body.theme-ja .ribbon{background:linear-gradient(90deg,var(--accent),var(--brand),var(--brand-d));}
  body.theme-en .ribbon{background:linear-gradient(90deg,#36486b 0 33%,#f7f4ef 33% 66%,#b56576 66% 100%);}

  header.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .logo{font-size:30px;}
  /* ===== ユニオンジャック紋章（英語モードのみ・ペール） ===== */
  .ujack{display:none;width:46px;height:28px;border-radius:3px;flex:none;vertical-align:middle;opacity:.92;
    border:1px solid var(--line-2);box-shadow:0 2px 8px var(--shadow-soft);
    --ub:#5a6e95;--uw:#f4efe6;--ur:#bf8794;
    background:
      linear-gradient(var(--ur) 0 0) center/5px 100% no-repeat,
      linear-gradient(var(--ur) 0 0) center/100% 5px no-repeat,
      linear-gradient(var(--uw) 0 0) center/10px 100% no-repeat,
      linear-gradient(var(--uw) 0 0) center/100% 10px no-repeat,
      linear-gradient(to bottom right,#0000 calc(50% - 1.6px),var(--ur) calc(50% - 1.6px),var(--ur) calc(50% + 1.6px),#0000 calc(50% + 1.6px)),
      linear-gradient(to bottom left,#0000 calc(50% - 1.6px),var(--ur) calc(50% - 1.6px),var(--ur) calc(50% + 1.6px),#0000 calc(50% + 1.6px)),
      linear-gradient(to bottom right,#0000 calc(50% - 3.6px),var(--uw) calc(50% - 3.6px),var(--uw) calc(50% + 3.6px),#0000 calc(50% + 3.6px)),
      linear-gradient(to bottom left,#0000 calc(50% - 3.6px),var(--uw) calc(50% - 3.6px),var(--uw) calc(50% + 3.6px),#0000 calc(50% + 3.6px)),
      var(--ub);}
  body.theme-en .ujack{display:inline-block;}
  .foot .ujack{width:36px;height:22px;margin:0 7px;vertical-align:-5px;}
  .umemon{display:none;width:46px;height:28px;border-radius:3px;flex:none;vertical-align:middle;opacity:.95;
    border:1px solid var(--line-2);box-shadow:0 2px 8px var(--shadow-soft);
    background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2722%27%20height%3D%2722%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cg%20fill%3D%27%23ffffff%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%277%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%2716.76%27%20cy%3D%2710.45%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%2714.94%27%20cy%3D%2716.05%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%279.06%27%20cy%3D%2716.05%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%277.24%27%20cy%3D%2710.45%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2712%27%20r%3D%273%27%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%27%2315568a%27%20stroke-width%3D%270.7%27%20stroke-linecap%3D%27round%27%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%2712%27%20y2%3D%279%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%2714.85%27%20y2%3D%2711.07%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%2713.76%27%20y2%3D%2714.43%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%2710.24%27%20y2%3D%2714.43%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%279.15%27%20y2%3D%2711.07%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2712%27%20r%3D%271%27%20fill%3D%27%2315568a%27%2F%3E%3C%2Fsvg%3E") 0 0/20px 20px repeat,#15568a;}
  body.theme-ja .umemon{display:inline-block;}
  .foot .umemon{width:36px;height:22px;margin:0 7px;vertical-align:-5px;}
  .ttl h1{font-size:20px;font-weight:800;letter-spacing:.01em;font-family:var(--display);}
  .ttl p{font-size:12px;color:var(--ink-2);margin-top:1px;}

  /* language toggle */
  .lang{margin-left:auto;display:inline-flex;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);
    box-shadow:0 4px 14px var(--shadow-soft);background:var(--card);}
  .lang button{appearance:none;border:0;background:transparent;font-family:var(--sans);font-size:13px;font-weight:800;
    padding:9px 16px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;gap:7px;transition:.15s;}
  .lang button.on{background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;}

  .course{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line-2);
    border-radius:12px;padding:7px 13px;box-shadow:0 4px 14px var(--shadow-soft);width:100%;max-width:430px;}
  .course label{font-size:11px;color:var(--ink-2);white-space:nowrap;}
  .course input{border:0;font-size:14px;font-weight:700;color:var(--ink);background:transparent;flex:1;font-family:var(--sans);}
  .course input:focus{outline:none;}

  /* tabs */
  .tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;}
  .tab{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
    font-family:var(--sans);font-size:13px;font-weight:800;padding:10px 18px;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 3px 9px var(--shadow-soft);}
  .tab:hover{transform:translateY(-1px);box-shadow:0 6px 14px var(--shadow-soft);}
  .tab.on{background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;border-color:var(--brand-d);
    box-shadow:0 6px 18px var(--shadow);}
  .tab .badge{background:rgba(255,255,255,.32);border-radius:8px;padding:0 8px;font-size:11px;}
  .tab:not(.on) .badge{background:var(--bg-2);}

  .pane{display:none;}
  .pane.on{display:block;}
  .grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:980px){.grid{grid-template-columns:minmax(380px,520px) 1fr;}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 8px 30px var(--shadow-soft);overflow:hidden;}
  .panel-hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:linear-gradient(180deg,#ffffff, color-mix(in srgb,var(--bg-2) 55%,#fff));}
  .panel-hd h2{font-size:14px;font-weight:800;font-family:var(--display);}
  .panel-hd .sub{font-size:11px;color:var(--ink-2);}
  .panel-bd{padding:15px 16px;}

  /* ===== buttons with depth/shadow ===== */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px;}
  .btn{appearance:none;font-family:var(--sans);font-size:12px;font-weight:800;cursor:pointer;border-radius:11px;
    padding:9px 14px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);
    display:inline-flex;align-items:center;gap:6px;transition:.13s;
    box-shadow:0 3px 0 var(--line-2), 0 6px 14px var(--shadow-soft);}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--line-2), 0 9px 18px var(--shadow-soft);}
  .btn:focus-visible{outline:none;box-shadow:0 3px 0 var(--line-2), 0 0 0 3px var(--shadow);}
  /* ▼ 押した瞬間がはっきり分かる：段差がつぶれて沈み込み＋押下グロー */
  .btn:active{transform:translateY(4px) scale(.97);filter:brightness(.93);
    box-shadow:0 0 0 var(--line-2), inset 0 3px 7px var(--shadow), 0 1px 3px var(--shadow-soft) !important;}
  .btn.pri{background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;border-color:var(--brand-d);
    box-shadow:0 4px 0 var(--brand-d), 0 8px 18px var(--shadow);}
  .btn.pri:hover{box-shadow:0 5px 0 var(--brand-d), 0 12px 22px var(--shadow);}
  .btn.pri:active{transform:translateY(4px) scale(.97);filter:brightness(.9);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.28), 0 1px 3px var(--shadow) !important;}
  .btn.gold{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 80%,#000));
    color:var(--accent-t);border-color:var(--accent);
    box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000), 0 8px 18px var(--shadow);}
  .btn.gold:active{transform:translateY(4px) scale(.97);filter:brightness(.9);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.2), 0 1px 3px var(--shadow) !important;}

  .fmt-row{display:flex;gap:6px;align-items:center;margin-bottom:9px;flex-wrap:wrap;}
  .fmt-row .lbl{font-size:11px;color:var(--ink-2);}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;box-shadow:0 3px 9px var(--shadow-soft);}
  .seg button{appearance:none;border:0;background:var(--card);font-family:var(--sans);font-size:11px;font-weight:800;
    padding:6px 12px;cursor:pointer;color:var(--ink-2);}
  .seg button.on{background:var(--info-bg);color:var(--info);}
  .seg button:active{filter:brightness(.9);transform:translateY(1px);}

  /* ▼ クラス（基礎／応用）絞り込みバー */
  .class-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
  .class-bar.hidden{display:none;}
  .class-bar .cl-lbl{font-size:11px;font-weight:800;color:var(--ink-2);}
  .cl-chip{appearance:none;font-family:var(--sans);font-size:12px;font-weight:800;cursor:pointer;border-radius:20px;
    padding:6px 14px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);
    box-shadow:0 3px 0 var(--line-2),0 5px 12px var(--shadow-soft);transition:.13s;}
  .cl-chip:hover{transform:translateY(-1px);}
  .cl-chip:active{transform:translateY(3px) scale(.97);filter:brightness(.93);box-shadow:inset 0 2px 6px var(--shadow);}
  .cl-chip.on{background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;border-color:var(--brand-d);
    box-shadow:0 4px 0 var(--brand-d),0 7px 16px var(--shadow);}
  .cl-chip .n{opacity:.75;font-weight:700;margin-left:4px;}

  /* ▼ 入力（インポート）ゾーン：枠線＋影でひと目で分かるように */  .input-zone{border:2px solid var(--brand);border-radius:14px;background:var(--card);
    box-shadow:0 8px 26px var(--shadow), inset 0 1px 0 #fff;overflow:hidden;transition:.15s;}
  .input-zone:focus-within{box-shadow:0 0 0 4px var(--shadow), 0 10px 30px var(--shadow);}
  .iz-label{display:flex;align-items:center;gap:8px;padding:9px 13px;font-size:12px;font-weight:800;color:#fff;
    background:linear-gradient(180deg,var(--brand),var(--brand-d));border-bottom:2px solid var(--brand-d);}
  .iz-label .dot{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35);}
  textarea#src{width:100%;min-height:430px;resize:vertical;border:0;border-radius:0;display:block;
    padding:13px 14px;font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--ink);
    background:color-mix(in srgb,var(--bg-1) 55%,#fff);tab-size:2;}
  textarea#src:focus{outline:none;}
  textarea#src::placeholder{color:var(--ink-2);opacity:.8;}

  .status{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill{border-radius:20px;padding:4px 12px;font-weight:800;font-size:11px;box-shadow:0 3px 9px var(--shadow-soft);}
  .pill.ok{background:var(--ok-bg);color:var(--ok);}
  .pill.warn{background:#fdf3df;color:#9a6a00;}
  .pill.err{background:var(--ng-bg);color:var(--ng);}
  .status .msg{color:var(--ink-2);font-size:11px;}

  details.cheat{margin-bottom:11px;border:1px dashed var(--line-2);border-radius:12px;
    background:color-mix(in srgb,var(--bg-1) 60%,#fff);}
  details.cheat>summary{cursor:pointer;list-style:none;padding:10px 13px;font-size:12px;font-weight:800;color:var(--info);}
  details.cheat>summary::-webkit-details-marker{display:none;}
  details.cheat>summary::before{content:"▶ ";font-size:9px;}
  details.cheat[open]>summary::before{content:"▼ ";}
  .cheat-bd{padding:0 14px 14px;font-size:12px;color:var(--ink);}
  .cheat-bd pre{background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    font-family:var(--mono);font-size:11.5px;line-height:1.65;overflow-x:auto;white-space:pre;margin:6px 0;}
  .cheat-bd code{background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:11px;}
  .cheat-bd table{border-collapse:collapse;width:100%;font-size:11.5px;margin:6px 0;}
  .cheat-bd th,.cheat-bd td{border:1px solid var(--line);padding:5px 8px;text-align:left;}
  .cheat-bd th{background:var(--bg-2);}

  .preview-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg-1);min-height:520px;
    box-shadow:inset 0 2px 8px var(--shadow-soft);}
  iframe.pv{width:100%;height:78vh;min-height:520px;border:0;display:block;background:transparent;}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-2);}
  .empty .e-emoji{font-size:42px;}
  .hint{font-size:11px;color:var(--ink-2);margin-top:9px;}
  .hidden{display:none !important;}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--ink-2);}

  /* ===== how-to pane ===== */
  .howto{max-width:980px;}
  .steps{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:8px;}
  @media(min-width:720px){.steps{grid-template-columns:1fr 1fr;}}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;
    box-shadow:0 6px 20px var(--shadow-soft);position:relative;overflow:hidden;}
  .step::before{content:attr(data-n);position:absolute;top:-14px;right:-6px;font-size:74px;font-weight:900;
    font-family:var(--display);color:var(--bg-2);line-height:1;}
  .step .sh{display:flex;align-items:center;gap:9px;margin-bottom:7px;position:relative;}
  .step .si{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;
    background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 4px 10px var(--shadow);}
  .step h3{font-size:14px;font-weight:800;position:relative;}
  .step p{font-size:12.5px;color:var(--ink-2);position:relative;line-height:1.75;}
  .step code{background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:11px;color:var(--info);}
  .note{background:var(--info-bg);border:1px solid var(--line-2);border-radius:13px;padding:14px 16px;font-size:12.5px;
    color:var(--ink);line-height:1.85;box-shadow:0 5px 16px var(--shadow-soft);}
  .note h4{font-size:13px;font-weight:800;color:var(--info);margin-bottom:5px;}
  .note code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:11px;}
  .howto h2.sec{font-size:15px;font-weight:800;margin:20px 0 10px;font-family:var(--display);}

  /* ===== スマホ最適化（〜600px） ===== */
  @media(max-width:600px){
    .app{padding:12px 12px 48px;}
    .ribbon{margin-bottom:10px;}
    header.hd{gap:10px;}
    .logo{font-size:26px;}
    .ttl h1{font-size:17px;}
    .ttl p{font-size:11px;}
    .lang{width:100%;margin-left:0;}
    .lang button{flex:1;justify-content:center;padding:10px 12px;}
    .course{max-width:none;}
    .tabs{gap:6px;}
    .tab{flex:1;justify-content:center;padding:11px 8px;font-size:12px;}
    .tab .badge{display:none;}
    .panel-bd{padding:12px 12px;}
    .panel-hd{padding:11px 12px;}
    .toolbar{gap:7px;}
    .btn{font-size:12px;padding:10px 12px;flex:1 1 calc(50% - 4px);justify-content:center;}
    .btn.pri,.btn.gold{flex-basis:100%;}
    .seg{width:100%;}
    .seg button{flex:1;text-align:center;padding:9px 6px;}
    textarea#src{min-height:300px;font-size:14px;}
    iframe.pv{height:68vh;min-height:380px;}
    #pv2{height:72vh !important;}
    .cl-chip{flex:1 1 calc(50% - 5px);text-align:center;}
    .step::before{font-size:58px;}
    .foot{font-size:10px;}
  }
  /* タップ操作の最適化（PC/スマホ共通） */
  button,.opt,.tab,.cl-chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body class="theme-ja">
<div class="app">
  <div class="ribbon"></div>

  <header class="hd">
    <div class="logo">🐰</div>
    <span class="ujack" aria-hidden="true" title="English mode"></span>
    <span class="umemon" aria-hidden="true" title="日本語モード"></span>
    <div class="ttl">
      <h1 data-i18n="appTitle">うさうさ作問スタジオ</h1>
      <p data-i18n="appTag">メモ・Excelで書く → 受講生用の演習に → 配布用HTMLを書き出し</p>
    </div>
    <div class="lang">
      <button id="lng-ja" class="on" onclick="setLang('ja')">🇯🇵 日本語</button>
      <button id="lng-en" onclick="setLang('en')">🇬🇧 English</button>
    </div>
  </header>

  <div style="margin-bottom:6px">
    <div class="course">
      <label data-i18n="courseLabel">講座名</label>
      <input id="courseTitle" type="text" value="LPIC-1 101 試験対策">
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tab-edit" onclick="switchTab('edit')"><span>✏️</span><span data-i18n="tabEdit">作問・編集</span></button>
    <button class="tab" id="tab-prev" onclick="switchTab('prev')"><span>📝</span><span data-i18n="tabPrev">演習プレビュー</span> <span class="badge" id="qcount">0</span></button>
    <button class="tab" id="tab-howto" onclick="switchTab('howto')"><span>📘</span><span data-i18n="tabHow">使い方</span></button>
  </div>

  <!-- ===== EDIT ===== -->
  <div class="pane on" id="pane-edit">
    <div class="grid">
      <div class="panel">

<script type="text/plain" id="quiz-css">
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
body.theme-ja{
  --brand:#15568a;--brand-d:#0e3c63;--accent:#5fa8d3;
  --bg-1:#f3f8fc;--bg-2:#e3eef7;--card:#fff;
  --ink:#15293c;--ink-2:#5f7589;--line:#dde8f2;--line-2:#c4d6e6;
  --ok:#2f8b6c;--ok-bg:#e7f5ef;--ng:#d05a52;--ng-bg:#fbe9e7;
  --info:#15568a;--info-bg:#e3eef7;--shadow:rgba(21,86,138,.20);--shadow-soft:rgba(21,86,138,.10);
  --display:var(--sans);
}
body.theme-en{
  --brand:#4a5f86;--brand-d:#36486b;--accent:#b56576;
  --bg-1:#f7f4ef;--bg-2:#eceef4;--card:#fff;
  --ink:#2c3242;--ink-2:#7c8295;--line:#e6e3da;--line-2:#cfd6e3;
  --ok:#4f8a78;--ok-bg:#e8f1ed;--ng:#b56576;--ng-bg:#f5e7ea;
  --info:#4a5f86;--info-bg:#e8ecf4;--shadow:rgba(54,72,107,.20);--shadow-soft:rgba(54,72,107,.10);
  --display:var(--serif);
}
body{font-family:var(--sans);color:var(--ink);background:var(--bg-1);line-height:1.6;}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 50px;}
.qhd{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:14px;}
.qhd .mark{font-size:24px;}
.ujack{display:none;width:42px;height:26px;border-radius:3px;flex:none;opacity:.92;border:1px solid var(--line-2);
  box-shadow:0 2px 8px var(--shadow-soft);--ub:#5a6e95;--uw:#f4efe6;--ur:#bf8794;
  background:
    linear-gradient(var(--ur) 0 0) center/5px 100% no-repeat,
    linear-gradient(var(--ur) 0 0) center/100% 5px no-repeat,
    linear-gradient(var(--uw) 0 0) center/9px 100% no-repeat,
    linear-gradient(var(--uw) 0 0) center/100% 9px no-repeat,
    linear-gradient(to bottom right,#0000 calc(50% - 1.5px),var(--ur) calc(50% - 1.5px),var(--ur) calc(50% + 1.5px),#0000 calc(50% + 1.5px)),
    linear-gradient(to bottom left,#0000 calc(50% - 1.5px),var(--ur) calc(50% - 1.5px),var(--ur) calc(50% + 1.5px),#0000 calc(50% + 1.5px)),
    linear-gradient(to bottom right,#0000 calc(50% - 3.3px),var(--uw) calc(50% - 3.3px),var(--uw) calc(50% + 3.3px),#0000 calc(50% + 3.3px)),
    linear-gradient(to bottom left,#0000 calc(50% - 3.3px),var(--uw) calc(50% - 3.3px),var(--uw) calc(50% + 3.3px),#0000 calc(50% + 3.3px)),
    var(--ub);}
body.theme-en .ujack{display:inline-block;}
.umemon{display:none;width:42px;height:26px;border-radius:3px;flex:none;opacity:.95;border:1px solid var(--line-2);
  box-shadow:0 2px 8px var(--shadow-soft);background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2722%27%20height%3D%2722%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cg%20fill%3D%27%23ffffff%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%277%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%2716.76%27%20cy%3D%2710.45%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%2714.94%27%20cy%3D%2716.05%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%279.06%27%20cy%3D%2716.05%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%277.24%27%20cy%3D%2710.45%27%20r%3D%273.7%27%2F%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2712%27%20r%3D%273%27%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%27%2315568a%27%20stroke-width%3D%270.7%27%20stroke-linecap%3D%27round%27%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%2712%27%20y2%3D%279%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%2714.85%27%20y2%3D%2711.07%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%2713.76%27%20y2%3D%2714.43%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%2710.24%27%20y2%3D%2714.43%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%2712%27%20x2%3D%279.15%27%20y2%3D%2711.07%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2712%27%20r%3D%271%27%20fill%3D%27%2315568a%27%2F%3E%3C%2Fsvg%3E") 0 0/19px 19px repeat,#15568a;}
body.theme-ja .umemon{display:inline-block;}
.qhd .qt{font-size:18px;font-weight:800;font-family:var(--display);}
.qhd .qt small{display:block;font-size:11px;font-weight:600;color:var(--ink-2);}
.reset{margin-left:auto;border:1px solid var(--line-2);background:var(--card);border-radius:11px;padding:7px 14px;
  font-size:12px;font-weight:800;cursor:pointer;color:var(--ink-2);font-family:var(--sans);
  box-shadow:0 3px 0 var(--line-2),0 6px 12px var(--shadow-soft);transition:.12s;}
.reset:hover{transform:translateY(-1px);}
.reset:active{transform:translateY(4px) scale(.97);filter:brightness(.93);box-shadow:inset 0 3px 7px var(--shadow);}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 15px;font-size:12px;color:var(--ink-2);min-width:78px;box-shadow:0 4px 12px var(--shadow-soft);}
.stat b{display:block;font-size:21px;font-weight:800;color:var(--ink);}
.prog{height:9px;background:var(--bg-2);border-radius:5px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line);}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--brand));transition:width .35s;}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.filters .fl{font-size:12px;color:var(--ink-2);margin-right:2px;}
.fb{border:1px solid var(--line-2);background:var(--card);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:800;
  cursor:pointer;color:var(--ink-2);font-family:var(--sans);box-shadow:0 3px 8px var(--shadow-soft);transition:.12s;}
.fb:hover{transform:translateY(-1px);}
.fb:active{transform:translateY(2px) scale(.97);filter:brightness(.92);box-shadow:inset 0 2px 5px var(--shadow);}
.fb.on{background:var(--info-bg);border-color:var(--brand);color:var(--info);}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;margin-bottom:13px;
  box-shadow:0 5px 20px var(--shadow-soft);border-left:4px solid var(--line-2);}
.card.right{border-left-color:var(--ok);}
.card.wrong{border-left-color:var(--ng);}
.c-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.qnum{border-radius:9px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;margin-top:1px;}
.qtype{font-size:10px;font-weight:800;color:var(--ink-2);border:1px solid var(--line-2);border-radius:7px;padding:1px 7px;margin-top:3px;white-space:nowrap;}
.qtext{font-size:14.5px;line-height:1.75;font-weight:600;flex:1;min-width:200px;}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:11px;border:1px solid var(--line-2);
  cursor:pointer;font-size:13.5px;background:var(--card);transition:.12s;box-shadow:0 2px 6px var(--shadow-soft);}
.opt:hover{background:var(--bg-2);}
.opt.sel{border-color:var(--brand);background:var(--info-bg);}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);}
.opt.wrongsel{border-color:var(--ng);background:var(--ng-bg);}
.mk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line-2);flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.opt.sel .mk{border-color:var(--brand);color:var(--brand);}
.opt.correct .mk{border-color:var(--ok);color:var(--ok);background:#fff;}
.opt.wrongsel .mk{border-color:var(--ng);color:var(--ng);background:#fff;}
.inp{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);font-size:13.5px;
  font-family:var(--mono);background:var(--bg-1);color:var(--ink);}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--shadow);}
.check{margin-top:11px;border:1px solid var(--brand-d);border-radius:11px;padding:8px 18px;font-size:12.5px;
  font-weight:800;cursor:pointer;background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;font-family:var(--sans);
  box-shadow:0 4px 0 var(--brand-d),0 8px 16px var(--shadow);transition:.12s;}
.check:hover{transform:translateY(-1px);}
.check:active{transform:translateY(4px) scale(.97);filter:brightness(.9);box-shadow:inset 0 3px 8px rgba(0,0,0,.28);}
.badge{display:inline-block;border-radius:9px;padding:4px 12px;font-size:12px;font-weight:800;margin-left:10px;}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.ng{background:var(--ng-bg);color:var(--ng);}
.explain{margin-top:13px;padding:13px 15px;background:color-mix(in srgb,var(--bg-2) 55%,#fff);border:1px solid var(--line);border-radius:12px;
  font-size:13px;line-height:1.85;color:var(--ink);}
.explain .etl{font-weight:800;color:var(--info);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.explain code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:12px;color:var(--info);}
.done{margin-top:22px;padding:24px;text-align:center;background:var(--card);border:1px dashed var(--accent);border-radius:15px;box-shadow:0 6px 20px var(--shadow-soft);}
.done .big{font-size:34px;}
.done .sc{font-size:22px;font-weight:800;margin:6px 0;font-family:var(--display);}
.empty{padding:60px 20px;text-align:center;color:var(--ink-2);}
.namebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:9px 13px;box-shadow:0 4px 14px var(--shadow-soft);}
.namebar span{font-size:12px;font-weight:800;color:var(--ink-2);white-space:nowrap;}
.namebar input{flex:1;min-width:140px;border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;
  font-size:14px;font-family:var(--sans);color:var(--ink);background:var(--bg-1);}
.namebar input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--shadow);}
.scorebar{margin-top:18px;background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:15px 16px;
  box-shadow:0 6px 22px var(--shadow-soft);}
.sb-title{font-size:13px;font-weight:800;color:var(--info);margin-bottom:10px;font-family:var(--display);}
.sb-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sb-btn{appearance:none;font-family:var(--sans);font-size:12.5px;font-weight:800;cursor:pointer;border-radius:11px;
  padding:10px 14px;border:1px solid var(--brand-d);color:#fff;background:linear-gradient(180deg,var(--brand),var(--brand-d));
  box-shadow:0 4px 0 var(--brand-d),0 8px 16px var(--shadow);transition:.12s;}
.sb-btn:hover{transform:translateY(-1px);}
.sb-btn:active{transform:translateY(4px) scale(.97);filter:brightness(.9);box-shadow:inset 0 3px 8px rgba(0,0,0,.28);}
.sb-toast{font-size:12px;font-weight:800;color:var(--ok);opacity:0;transition:opacity .2s;margin-left:4px;}
@media(max-width:600px){
  .wrap{padding:14px 11px 44px;}
  .qhd .qt{font-size:16px;}
  .stat{flex:1;min-width:0;padding:8px 8px;}
  .stat b{font-size:18px;}
  .card{padding:14px 13px;}
  .qtext{font-size:14px;}
  .opt{font-size:14px;padding:11px 12px;}
  .check{padding:11px 18px;font-size:13.5px;width:100%;}
  .inp{font-size:15px;}
  .fb,.reset{padding:8px 13px;}
  .sb-btn{flex:1 1 100%;padding:12px 14px;}
  .namebar input{font-size:15px;}
}
button,.opt,.fb,.reset{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
</script>

document.getElementById("lbl-ok").textContent=L.correct;

function getFiltered(){return curCat==="all"?QS:QS.filter(function(q){return q.cat===curCat;});}
function renderFilters(){
  var el=document.getElementById("filters");if(!CATS.length){el.innerHTML="";return;}
  var h='<span class="fl">'+L.cat+'：</span><button class="fb on" onclick="filt(\'all\',this)">'+L.all+'</button>';
  CATS.forEach(function(c){h+='<button class="fb" data-c="'+esc(c)+'" onclick="filt(this.dataset.c,this)">'+esc(c)+'</button>';});
  el.innerHTML=h;
}
function filt(c,btn){curCat=c;var bs=document.querySelectorAll(".fb");for(var i=0;i<bs.length;i++)bs[i].classList.remove("on");btn.classList.add("on");renderList();}
function renderStats(){
  var done=0,ok=0;QS.forEach(function(q){if(state["r"+q.n]){done++;if(state[q.n])ok++;}});
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-ok").textContent=ok;
  document.getElementById("s-ng").textContent=done-ok;
  document.getElementById("prog-i").style.width=(QS.length?Math.round(done/QS.length*100):0)+"%";
  var dn=document.getElementById("done-box");
  if(done===QS.length&&QS.length>0){dn.style.display="block";var pct=Math.round(ok/QS.length*100);
    var emo=pct>=80?"🎉":pct>=60?"👍":"🍜";
    dn.innerHTML='<div class="big">'+emo+'</div><div class="sc">'+L.done(ok,QS.length,pct)+'</div>'
      +'<div style="color:var(--ink-2);font-size:13px">'+L.msg(pct)+'</div>';
  } else dn.style.display="none";
}
function renderList(){
  var qs=getFiltered(),el=document.getElementById("qlist");
  if(!qs.length){el.innerHTML='<div class="empty">'+L.none+'</div>';return;}
  el.innerHTML=qs.map(buildCard).join("");
  qs.forEach(function(q){if(q.type==="input"){var inp=document.getElementById("inp-"+q.n);if(inp&&state["v"+q.n]!=null)inp.value=state["v"+q.n];}});
}
function buildCard(q){
  var s=state[q.n],cls=state["r"+q.n]?(s?"right":"wrong"):"",col=catColor(q.cat),rev=!!state["r"+q.n];
  var typeLabel=q.type==="multi"?L.tMulti:q.type==="input"?L.tInput:L.tSingle,body="";
  if(q.type==="single"||q.type==="multi"){
    var sel=state["s"+q.n]||[];
    body='<div class="opts">'+q.opts.map(function(o,i){
      var c2="";if(rev){if(q.ans.indexOf(i)>=0)c2="correct";else if(sel.indexOf(i)>=0)c2="wrongsel";}else if(sel.indexOf(i)>=0)c2="sel";
      var mk=rev?(q.ans.indexOf(i)>=0?"✓":(sel.indexOf(i)>=0?"✗":"")):(sel.indexOf(i)>=0?(q.type==="multi"?"✓":"●"):"");
      return '<div class="opt '+c2+'" onclick="pick('+q.n+','+i+','+(q.type==="multi")+')"><span class="mk">'+mk+'</span><span>'+esc(o)+'</span></div>';
    }).join("")+'</div>';
    if(!rev)body+='<button class="check" onclick="checkChoice('+q.n+')">'+L.answer+'</button>';
  } else {
    body='<input class="inp" id="inp-'+q.n+'" type="text" placeholder="'+L.ph+'" '+(rev?"disabled":"")+'>';
    if(!rev)body+='<button class="check" onclick="checkInput('+q.n+')">'+L.answer+'</button>';
    else body+= s?'<span class="badge ok">'+L.okBadge+'</span>':'<span class="badge ng">'+L.ngBadge+esc(q.ans.join(" / "))+'</span>';
  }
  var exp=(rev&&q.explain)?'<div class="explain"><div class="etl">🐰 '+L.explain+'</div>'+q.explain+'</div>':"";
  var catTag=q.cat?'<span class="qnum" style="background:'+col[0]+';color:'+col[1]+'">'+esc(q.cat)+'</span>':'';
  return '<div class="card '+cls+'" id="card-'+q.n+'"><div class="c-head">'
    +'<span class="qnum" style="background:var(--bg-2);color:var(--ink-2)">Q'+q.n+'</span>'+catTag
    +'<span class="qtype">'+typeLabel+'</span>'
    +'<div class="qtext">'+nl2br(q.text)+(q.type==="multi"?' <span style="font-size:11px;color:var(--ink-2)">'+L.multiHint+'</span>':'')+'</div>'
    +'</div>'+body+exp+'</div>';
}
function pick(n,i,multi){if(state["r"+n])return;if(!state["s"+n])state["s"+n]=[];
  if(multi){var p=state["s"+n].indexOf(i);if(p>=0)state["s"+n].splice(p,1);else state["s"+n].push(i);}else state["s"+n]=[i];refresh(n);}
function checkChoice(n){var q=QS[n-1];if(!q||q.type==="input"||state["r"+n])return;var sel=(state["s"+n]||[]).slice().sort(function(a,b){return a-b;}),ans=q.ans.slice().sort(function(a,b){return a-b;});
  state["r"+n]=true;state[n]=(sel.join(",")===ans.join(","));renderStats();refresh(n);}
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g," ");}
function checkInput(n){var q=QS[n-1];if(!q||q.type!=="input"||state["r"+n])return;var v=(document.getElementById("inp-"+n).value||"");state["v"+n]=v;
  state["r"+n]=true;state[n]=q.ans.some(function(a){return norm(a)===norm(v);});renderStats();refresh(n);}
function refresh(n){var q=QS[n-1],old=document.getElementById("card-"+n);if(!old)return;
  var tmp=document.createElement("div");tmp.innerHTML=buildCard(q);old.replaceWith(tmp.firstChild);
  if(q.type==="input"&&state["v"+n]!=null){var inp=document.getElementById("inp-"+n);if(inp)inp.value=state["v"+n];}}
function resetAll(){state={};renderStats();renderList();}
document.getElementById("reset-btn").textContent=L.reset;
/* ===== スコア出力（名前・日付・時間つき） ===== */
document.getElementById("name-label").textContent=L.nameLabel+"：";
document.getElementById("stu-name").setAttribute("placeholder",L.namePh);
document.getElementById("sb-title").textContent=L.scoreTitle;
document.getElementById("sb-memo").textContent=L.exMemo;
document.getElementById("sb-csv").textContent=L.exCsv;
document.getElementById("sb-notion").textContent=L.exNotion;
try{var sv=localStorage.getItem("usausa_stu_name");if(sv)document.getElementById("stu-name").value=sv;}catch(e){}
document.getElementById("stu-name").addEventListener("input",function(){try{localStorage.setItem("usausa_stu_name",this.value);}catch(e){}});
function pad2(n){return (n<10?"0":"")+n;}
function nowParts(){var d=new Date();return {date:d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()),time:pad2(d.getHours())+":"+pad2(d.getMinutes())};}
function scoreData(){
  var ok=0,done=0;QS.forEach(function(q){if(state["r"+q.n]){done++;if(state[q.n])ok++;}});
  var pct=QS.length?Math.round(ok/QS.length*100):0;
  var byCat=CATS.map(function(c){var qs=QS.filter(function(q){return q.cat===c;});var co=qs.filter(function(q){return state[q.n];}).length;return {cat:c,ok:co,total:qs.length};});
  var nm=(document.getElementById("stu-name").value||"").trim()||L.fEnterName;
  var np=nowParts();
  return {name:nm,date:np.date,time:np.time,course:META.title||"",ok:ok,total:QS.length,pct:pct,byCat:byCat};
}
function buildMemo(){var s=scoreData();
  var t="■ "+s.course+" "+L.scoreHeading+"\n";
  t+=L.fName+"："+s.name+"\n"+L.fDate+"："+s.date+"\n"+L.fTime+"："+s.time+"\n";
  t+=L.fScore+"："+s.ok+" / "+s.total+"（"+s.pct+"%）\n";
  if(s.byCat.length){t+=L.fByCat+"：\n";s.byCat.forEach(function(b){t+="・"+b.cat+" "+b.ok+"/"+b.total+"\n";});}
  return t.replace(/\n+$/,"");
}
function buildCsv(){var s=scoreData();
  var head=[L.fName,L.fDate,L.fTime,L.fCourse,L.fScore,L.fTotal,L.fRate];
  var row=[s.name,s.date,s.time,s.course,s.ok,s.total,s.pct+"%"];
  function cell(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}
  return "\ufeff"+head.map(cell).join(",")+"\r\n"+row.map(cell).join(",");
}
function buildNotion(){var s=scoreData();
  var t="| "+L.fName+" | "+L.fDate+" | "+L.fTime+" | "+L.fCourse+" | "+L.fScore+" | "+L.fRate+" |\n";
  t+="| --- | --- | --- | --- | --- | --- |\n";
  t+="| "+s.name+" | "+s.date+" | "+s.time+" | "+s.course+" | "+s.ok+"/"+s.total+" | "+s.pct+"% |";
  if(s.byCat.length){t+="\n\n"+L.fByCat+"\n| "+L.cat+" | "+L.fScore+" |\n| --- | --- |\n";
    s.byCat.forEach(function(b){t+="| "+b.cat+" | "+b.ok+"/"+b.total+" |\n";});t=t.replace(/\n$/,"");}
  return t;
}
function copyText(txt,msg){
  function done(){toast(msg);}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){legacy();});return;}}catch(e){}
  legacy();
  function legacy(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast(txt);}document.body.removeChild(ta);}
}
function dlFile(name,txt,mime){try{var b=new Blob([txt],{type:mime});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);toast(L.saved);}catch(e){copyText(txt,L.copied);}}
function safeNm(s){return String(s||"score").replace(/[\\/:*?"<>|]/g,"_").slice(0,40);}
function toast(m){var el=document.getElementById("sb-toast");el.textContent=m;el.style.opacity="1";clearTimeout(toast._t);toast._t=setTimeout(function(){el.style.opacity="0";},2200);}
function exMemo(){copyText(buildMemo(),L.copied);}
function exNotion(){copyText(buildNotion(),L.copied);}
function exCsv(){var s=scoreData();dlFile(safeNm(s.course)+"_"+safeNm(s.name)+"_"+s.date+".csv",buildCsv(),"text/csv;charset=utf-8");}
renderFilters();renderStats();renderList();
</script>

/* ---------------- parser (verified) ---------------- */
function detectFormat(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()!=="";});
  if(!lines.length)return "memo";
  var tabbed=lines.filter(function(l){return l.indexOf("\t")>=0;}).length;
  if(tabbed>=Math.max(1,Math.floor(lines.length*0.6)))return "tsv";
  var first=lines[0];
  if(/問題|Question|Type/i.test(first)&&first.indexOf(",")>=0&&first.indexOf("\t")<0)return "tsv";
  return "memo";
}
function mdInline(s){s=String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');return s;}
function parseMemo(text){
  var lines=text.split(/\r?\n/),out=[],cur=null,curCat="",curClass="";
  function commit(){if(cur){finalize(cur);out.push(cur);cur=null;}}
  function finalize(q){
    if(q.answers.length){q.type="input";q.ans=q.answers.slice();}
    else{var correct=[];q.opts.forEach(function(o,i){if(o.correct)correct.push(i);});
      if(q.forced==="multi")q.type="multi";else if(q.forced==="single")q.type="single";else q.type=correct.length>=2?"multi":"single";
      q.ans=correct;q.opts=q.opts.map(function(o){return o.text;});}
    q.text=q.text.trim();
    q.explain=q.explain.trim()?q.explain.trim().split(/\n/).map(function(l){return mdInline(l);}).join("<br>"):"";
  }
  for(var i=0;i<lines.length;i++){var t=lines[i].trim();if(t==="")continue;
    var mClass=t.match(/^[@＠](?:class|クラス)\s+(.+)$/i);if(mClass){commit();curClass=mClass[1].trim();continue;}
    var mCat=t.match(/^[@＠]cat\s+(.+)$/);if(mCat){commit();curCat=mCat[1].trim();continue;}
    if(/^#/.test(t)){commit();var qt=t.replace(/^#+\s?/,""),forced=null;
      var fm=qt.match(/^\[(複数|単一|記述|multi|single|input)\]\s*/i);
      if(fm){var f=fm[1].toLowerCase();forced=(f==="複数"||f==="multi")?"multi":(f==="記述"||f==="input")?"input":"single";qt=qt.slice(fm[0].length);}
      cur={cls:curClass,cat:curCat,text:qt,type:"single",forced:forced,opts:[],answers:[],ans:[],explain:""};if(forced==="input")cur.type="input";continue;}
    if(cur){
      if(/^[\-・]\s*/.test(t)&&cur.forced!=="input"&&!cur.answers.length){var correct=false,body=t.replace(/^[\-・]\s*/,"");
        if(/^\*/.test(body)){correct=true;body=body.replace(/^\*\s*/,"");}cur.opts.push({text:body.trim(),correct:correct});continue;}
      if(/^=\s*/.test(t)){cur.answers.push(t.replace(/^=\s*/,"").trim());continue;}
      if(/^>\s?/.test(t)){cur.explain+=(cur.explain?"\n":"")+t.replace(/^>\s?/,"");continue;}
      if(!cur.opts.length&&!cur.answers.length){cur.text+="\n"+t;}else{cur.explain+=(cur.explain?"\n":"")+t;}
    }
  }
  commit();return out;
}
function splitTabOrCsv(line){if(line.indexOf("\t")>=0)return line.split("\t");
  var res=[],cur="",q=false;for(var i=0;i<line.length;i++){var c=line[i];
    if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===","&&!q){res.push(cur);cur="";}else cur+=c;}
  res.push(cur);return res;}
function parseTSV(text){
  var rows=text.split(/\r?\n/).filter(function(l){return l.trim()!=="";}).map(splitTabOrCsv);if(!rows.length)return [];
  var head=rows[0].map(function(c){return c.trim();});
  var hasHeader=head.some(function(c){return c==="問題文"||c==="カテゴリ"||c==="種別"||c==="クラス"||/^選択肢/.test(c)||c==="正解"||c==="解説"||/^Question$/i.test(c)||/^Category$/i.test(c)||/^Type$/i.test(c)||/^Class$/i.test(c)||/^Level$/i.test(c)||/^Option/i.test(c)||/^Answer$/i.test(c)||/^Explanation$/i.test(c);});
  var idx,dataRows;
  if(hasHeader){idx={cls:-1,cat:-1,type:-1,text:-1,opts:[],ans:-1,exp:-1};
    head.forEach(function(c,i){
      if(/^クラス$|^Class$|^Level$|レベル/i.test(c))idx.cls=i;
      else if(/カテゴリ|分類|Category/i.test(c))idx.cat=i;
      else if(/種別|タイプ|形式|Type/i.test(c))idx.type=i;
      else if(/問題文|問題|Question/i.test(c))idx.text=i;
      else if(/選択肢|選択|Option/i.test(c))idx.opts.push(i);
      else if(/正解|解答|答え|Answer/i.test(c))idx.ans=i;
      else if(/解説|説明|Explanation/i.test(c))idx.exp=i;});
    dataRows=rows.slice(1);}
  else{idx={cls:0,cat:1,type:2,text:3,opts:[4,5,6,7,8],ans:9,exp:10};dataRows=rows;}
  var out=[];
  dataRows.forEach(function(r){function g(i){return(i>=0&&i<r.length)?String(r[i]).trim():"";}
    var text=g(idx.text);if(!text)return;
    var typeStr=g(idx.type),cat=g(idx.cat),cls=g(idx.cls),exp=g(idx.exp),opts=idx.opts.map(g).filter(function(x){return x!=="";}),ansStr=g(idx.ans),type;
    if(/記述|input|記入|text/i.test(typeStr))type="input";
    else if(/複数|multi/i.test(typeStr))type="multi";
    else if(/単一|single/i.test(typeStr))type="single";
    else type=opts.length?(/[,、]/.test(ansStr)?"multi":"single"):"input";
    var q={cls:cls,cat:cat,text:text,type:type,opts:[],ans:[],explain:exp?mdInline(exp):""};
    if(type==="input"){q.ans=ansStr.split(/[;；]/).map(function(s){return s.trim();}).filter(Boolean);if(!q.ans.length&&ansStr)q.ans=[ansStr];}
    else{q.opts=opts;q.ans=ansStr.split(/[,、\s]+/).map(function(s){return parseInt(s,10)-1;}).filter(function(n){return n>=0&&n<opts.length;});}
    out.push(q);});
  return out;
}
function parse(text){var f=fmt;if(f==="auto")f=detectFormat(text);
  document.getElementById("fmt-detected").textContent= text.trim()?(tt("detPrefix")+(f==="tsv"?tt("detTsv"):tt("detMemo"))):"";
  return f==="tsv"?parseTSV(text):parseMemo(text);}

/* ---------------- build student HTML ---------------- */
function escAttr(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function buildQuizHTML(data,meta){
  var css=document.getElementById("quiz-css").textContent;
  var js=document.getElementById("quiz-js").textContent;
  var body=document.getElementById("quiz-body").textContent;
  var theme=meta.lang==="en"?"en":"ja";
  var p=[];
  p.push('<!DOCTYPE html><html lang="'+(meta.lang||"ja")+'"><head><meta charset="UTF-8">');
  p.push('<meta name="viewport" content="width=device-width, initial-scale=1.0">');
  p.push('<title>'+escAttr(meta.title)+'</title><style>'+css+'</style></head>');
  p.push('<body class="theme-'+theme+'">'+body);
  p.push('<scr'+'ipt>window.QUIZ_DATA='+JSON.stringify(data)+';window.QUIZ_META='+JSON.stringify(meta)+';\n'+js+'</scr'+'ipt>');
  p.push('</body></html>');
  return p.join("");
}

/* ---------------- render ---------------- */
function classesOf(data){var seen=[];data.forEach(function(q){var c=q.cls&&q.cls.trim();if(c&&seen.indexOf(c)<0)seen.push(c);});return seen;}
function classFiltered(data,cls){if(!cls||cls==="all")return data;return data.filter(function(q){return (q.cls&&q.cls.trim())===cls;});}
function metaFor(cls){
  var base=document.getElementById("courseTitle").value.trim()||(LANG==="en"?"Quiz":"演習");
  var title=base;
  if(cls&&cls!=="all")title=LANG==="en"?(base+" — "+cls):(base+"【"+cls+"】");
  return {title:title,lang:LANG};
}
function getMeta(){return metaFor(curClass);}
function renderClassBar(classes){
  var bar=document.getElementById("class-bar");
  if(!classes.length){bar.className="class-bar hidden";bar.innerHTML="";if(curClass!=="all")curClass="all";return;}
  if(curClass!=="all"&&classes.indexOf(curClass)<0)curClass="all";
  var counts={};lastData.forEach(function(q){var c=(q.cls&&q.cls.trim())||"";if(c)counts[c]=(counts[c]||0)+1;});
  var h='<span class="cl-lbl">'+tt("classLabel")+'</span>';
  h+='<button class="cl-chip '+(curClass==="all"?"on":"")+'" onclick="setClass(\'all\')">'+tt("classAll")+'<span class="n">'+lastData.length+'</span></button>';
  classes.forEach(function(c){
    h+='<button class="cl-chip '+(curClass===c?"on":"")+'" onclick="setClass(this.dataset.c)" data-c="'+c.replace(/"/g,"&quot;")+'">'+c+'<span class="n">'+(counts[c]||0)+'</span></button>';
  });
  bar.className="class-bar";bar.innerHTML=h;
}
function setClass(c){curClass=c;render();}
function render(){
  var text=document.getElementById("src").value,data;
  try{data=parse(text);}catch(e){lastData=[];showStatus("err",tt("stErr")(e.message),0,0);return;}
  lastData=data;
  var classes=classesOf(data);
  renderClassBar(classes);
  var warn=0;
  data.forEach(function(q){
    if((q.type==="single"||q.type==="multi")&&(!q.ans||!q.ans.length))warn++;
    if(q.type==="input"&&(!q.ans||!q.ans.length))warn++;
    if((q.type==="single"||q.type==="multi")&&q.opts.length<2)warn++;});
  var shown=classFiltered(data,curClass);
  var html=shown.length?buildQuizHTML(shown,metaFor(curClass)):"";
  var pv=document.getElementById("pv"),pv2=document.getElementById("pv2"),empty=document.getElementById("pvEmpty");
  if(shown.length){empty.classList.add("hidden");pv.classList.remove("hidden");pv.srcdoc=html;pv2.srcdoc=html;}
  else{empty.classList.remove("hidden");pv.classList.add("hidden");pv2.srcdoc="";}
  document.getElementById("qcount").textContent=shown.length;
  document.getElementById("prev-sub").textContent=tt("subTotal")(metaFor(curClass).title,shown.length);
  // class breakdown string
  var brk="";
  if(classes.length){var counts={};data.forEach(function(q){var c=(q.cls&&q.cls.trim())||"";if(c)counts[c]=(counts[c]||0)+1;});
    brk=" ／ "+classes.map(function(c){return c+":"+counts[c];}).join(LANG==="en"?", ":"、");}
  if(!text.trim())showStatus("ok",tt("stReady"),0,0);
  else if(!data.length)showStatus("warn",tt("stNone"),0,warn);
  else if(warn)showStatus("warn",tt("stWarn")(warn)+brk,data.length,warn);
  else showStatus("ok",tt("stOk")+brk,data.length,warn);
  save();
}
function showStatus(kind,msg,count,warn){
  var pill=document.getElementById("st-pill");
  pill.className="pill "+(kind==="err"?"err":kind==="warn"?"warn":"ok");
  pill.textContent=count+" "+tt("qUnit")+(warn?tt("warnUnit")(warn):"");
  document.getElementById("st-msg").textContent=msg;
}

function download(filename,text,mime){var blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);}

function exportByClass(){

  setTimeout(function(){alert(tt("byClassDone")(classes.length));},classes.length*350+100);

function exportJSON(){var payload={app:"usausa_quiz_maker",version:2,lang:LANG,curClass:curClass,meta:metaFor("all"),format:fmt,source:document.getElementById("src").value,data:lastData};

function importJSON(ev){var file=ev.target.files[0];if(!file)return;var r=new FileReader();

var SAMPLE_JA=
"@class 基礎クラス\n@cat コマンド基礎\n\n# manコマンドでセクション1のマニュアルを表示するのはどれ？\n- man command(1)\n- *man 1 command\n- man -s 1 command\n- man command@1\n> manは `man [セクション番号] コマンド名` の順。\n> 1=ユーザーコマンド / 5=設定ファイル / 8=管理コマンド。\n\n"+
"# [記述] locateコマンドが使うデータベースを更新するプログラムは？\n= updatedb\n> **find** はリアルタイム走査、**locate** は事前DBを高速検索。DB更新は `updatedb`。\n\n"+
"@cat リダイレクト\n\n# fooの出力を画面に出しつつ /tmp/foodata にも書き込むのは？\n- foo | cp /tmp/foodata\n- *foo | tee /tmp/foodata\n- foo > /tmp/foodata\n> `tee` はT字管。標準入力を「画面」と「ファイル」の両方へ。追記は `tee -a`。\n\n"+
"@class 応用クラス\n@cat リダイレクト\n\n# [複数] bashで有効なリダイレクト演算子はどれ？（2つ選択）\n- *2>&1\n- %>\n- *<\n- >>>\n- #>\n> `2>&1`=標準エラーを標準出力へ。`<`=標準入力。`%> >>> #>` は無効。\n\n"+
"@cat viエディタ\n\n# viで現在行と次の行の2行を削除するコマンドは？\n- 2d\n- *2dd\n- dd2\n> 数字は「コマンドの前」。`2dd`=2行削除、`2yy`=2行コピー。";
var SAMPLE_EN=
"@class Basic\n@cat Commands\n\n# Which command shows section 1 of the man page?\n- man command(1)\n- *man 1 command\n- man -s 1 command\n- man command@1\n> man uses `man [section] command`.\n> 1=user commands / 5=config files / 8=admin commands.\n\n"+
"# [input] Which program updates the database used by locate?\n= updatedb\n> **find** scans in real time; **locate** searches a prebuilt DB. Update it with `updatedb`.\n\n"+
"@cat Redirection\n\n# Which writes foo's output to screen AND /tmp/foodata at the same time?\n- foo | cp /tmp/foodata\n- *foo | tee /tmp/foodata\n- foo > /tmp/foodata\n> `tee` is a T-pipe: send stdin to both screen and file. Append with `tee -a`.\n\n"+
"@class Advanced\n@cat Redirection\n\n# [multi] Which are valid redirection operators in bash? (choose 2)\n- *2>&1\n- %>\n- *<\n- >>>\n- #>\n> `2>&1` sends stderr to stdout. `<` is stdin. `%> >>> #>` are invalid.\n\n"+
"@cat vi editor\n\n# Which command deletes the current line and the next (2 lines)?\n- 2d\n- *2dd\n- dd2\n> The count goes BEFORE the command. `2dd` deletes 2 lines, `2yy` yanks 2.";
function loadSample(){setFmt("memo");
  document.getElementById("courseTitle").value=tt("sampleTitle");
  document.getElementById("src").value=LANG==="en"?SAMPLE_EN:SAMPLE_JA;render();}

/* ---------------- autosave ---------------- */
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({t:document.getElementById("courseTitle").value,f:fmt,l:LANG,c:curClass,s:document.getElementById("src").value}));}catch(e){}}
function load(){try{var p=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(p){if(p.l)LANG=p.l;if(p.c)curClass=p.c;if(p.t)document.getElementById("courseTitle").value=p.t;if(p.f)fmt=p.f;document.getElementById("src").value=p.s||"";}}catch(e){}}

/* ---------------- boot ---------------- */
load();
applyLang();
["auto","memo","tsv"].forEach(function(x){document.getElementById("f-"+x).classList.toggle("on",x===fmt);});
document.getElementById("src").addEventListener("input",render);
document.getElementById("courseTitle").addEventListener("input",render);
if(!document.getElementById("src").value.trim()){loadSample();}else{render();}
</script>
</body>
</html>
